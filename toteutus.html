<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mari Siljamo - Toteutus</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">Mari Siljamo<br><small>Hyvinvointi</small></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#valikko"
                aria-controls="valikko" aria-expanded="false" aria-label="Avaa valikko">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="valikko">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Etusivu</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#karuselli">Karuselli</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#ruudukko">Ruudukko</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#kortit">Kortit</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#haitari">Haitari</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html#taulukko">Taulukko</a></li>
                    <li class="nav-item"><a class="nav-link active" href="toteutus.html">Toteutus</a></li>
                    <li class="nav-item"><a class="nav-link" href="poke.html">Pokemon haku</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div id="vastaus"></div>
    </main>

    <script>
        fetch("https://marisiljamo-cmyk.github.io/JSON/tietue.json")
            .then(function (response) {
                return response.json();
            })
            .then(function (responseJson) {
                kerro(responseJson);
            })
            .catch(function (error) {
                document.getElementById("vastaus").innerHTML = "<p>Tietoa ei pystytä hakemaan</p>";
            });

        function kerro(obj) {
            let tiedot = "<h1>" + obj.otsikko + "</h1><br>" + obj.kuvaus + "<br><hr>";

            tiedot += '<p><img src="' + obj.kuva + '" class="img-fluid rounded" style="max-height: 300px;"></p>';

            tiedot += "<h3>Toteutus</h3>"
                + "Nimi: " + obj.toteutus.nimi + "<br>"
                + "Osallistujien lukumäärä: " + obj.toteutus.osallistujienMaara + " kpl<br>"
                + "Alkamis- ja loppumisaika: " + obj.toteutus.alkamispaiva + " – " + obj.toteutus.loppumispaiva + "<br>"
                + "Kesto: " + obj.toteutus.kestoViikkoina + " viikkoa<br>";

            tiedot += "<p><h3>Osallistujat</h3></p><ul>";
            for (let i = 0; i < obj.osallistujat.length; i++) {
                tiedot += "<li>" + obj.osallistujat[i] + "</li>";
            }
            tiedot += "</ul>";

            tiedot += "<p><h3> Aiheet </h3>";
            for (var i = 0; i < obj.tekniikat.length; i++) {
                tiedot += "<b>Aihe: " + obj.tekniikat[i].aihe + "</b>";
                tiedot += ' <a href="' + obj.tekniikat[i].linkki + '">' + obj.tekniikat[i].linkki + "</a><br>";
            }
            tiedot += "</p>";

            document.getElementById("vastaus").innerHTML = tiedot;
        }
    </script>
</body>

</html>
